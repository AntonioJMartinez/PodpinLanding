name: Deploy Podpin to Firebase

# getpodpin.com is served by Firebase Hosting (GitHub Pages is retired). Manual until the
# Workload Identity Federation variables below are configured; then add `push: branches: [main]`.
on:
  workflow_dispatch:
    inputs:
      only:
        description: firebase deploy --only targets
        default: hosting,functions,firestore
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://getpodpin.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Site tests and build
        run: |
          npm ci
          npm test
          npm run build:site
          npm run check:site
      - name: Share function tests
        working-directory: functions
        run: |
          npm ci
          npm test
      # Workload Identity Federation: no long-lived key in GitHub. Set the repository
      # variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only "${{ inputs.only }}" --project podcast-ajms --non-interactive --force
      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        env:
          SITE: https://getpodpin.com
          INDEXNOW_KEY: 3e122ef193bfdaa88fabd884c6a85c25
        run: |
          sleep 60
          curl -fsSL "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          jq -n --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" --arg loc "$SITE/$INDEXNOW_KEY.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' > payload.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code} for $(wc -l < urls.txt) URLs\n" \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @payload.json
